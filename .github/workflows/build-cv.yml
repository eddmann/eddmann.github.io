name: Build CV

on:
  push:
    branches:
      - main
    paths:
      - 'cv/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        working-directory: cv
        run: bun install --frozen-lockfile

      - name: Build CV (HTML, PDF, TXT)
        working-directory: cv
        run: bun run build

      - name: Copy artifacts to static
        run: |
          mkdir -p static
          cp cv/cv.html static/cv.html
          cp cv/cv.pdf static/cv.pdf
          cp cv/cv.json static/cv.json
          cp cv/cv.txt static/cv.txt

      - name: Commit and push updated artifacts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/cv.html static/cv.pdf static/cv.json static/cv.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "Update CV artifacts"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT
  publish:
    needs: build
    if: needs.build.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish.yaml
